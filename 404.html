<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Crowsons Global</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/logo-icon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#05070a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/styles.css">
<style>
  .lost {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #05070a url("/assets/hero/closeup-desktop-poster.jpg") 50% 35% / cover no-repeat;
    color: var(--color-cream);
    overflow: hidden;
  }
  .lost::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(31, 111, 168, 0.24) 0%, rgba(10, 15, 13, 0.25) 35%, rgba(10, 15, 13, 0.78) 70%, rgba(5, 7, 10, 0.96) 100%);
  }
  .lost > * { position: relative; }
  .lost-top { padding: 28px 0; }
  .lost-top img { height: 56px; width: auto; }
  .lost-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    text-align: center;
    padding-bottom: 12vh;
  }
  .lost-code {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--color-accent-blue-light);
    margin-bottom: 14px;
  }
  .lost h1 {
    margin: 0;
    font-family: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(54px, 8vw, 112px);
    line-height: 0.92;
    letter-spacing: 0.05em;
    color: var(--color-cream);
  }
  .lost-rule {
    display: block;
    width: min(520px, 80%);
    height: 1.5px;
    margin: 22px auto 18px;
    background: linear-gradient(90deg, transparent, #5b9fd0 20%, var(--color-accent-blue-light) 50%, #5b9fd0 80%, transparent);
  }
  .lost p {
    max-width: 460px;
    margin: 0 auto 30px;
    font-size: 16px;
    color: rgba(243, 239, 228, 0.8);
  }
  .lost .btn-ghost { color: var(--color-cream); border-color: var(--hero-border-strong); }
  .lost-cta { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<main class="lost">
  <div class="lost-top">
    <div class="container">
      <a href="/" aria-label="Crowsons Global home"><img src="/assets/logo-light.png" alt="Crowsons Global"></a>
    </div>
  </div>

  <div class="lost-body">
    <div class="container">
      <span class="lost-code">404 &middot; Page not found</span>
      <h1>This page has flown.</h1>
      <span class="lost-rule" aria-hidden="true"></span>
      <p>The link may be out of date or mistyped. Everything else is right where you left it.</p>
      <div class="lost-cta">
        <a href="/" class="btn btn-primary">
          Back to home
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a href="/#contact" class="btn btn-ghost">Get in touch</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
